target-version = "py314"
line-length = 120

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "D",
]

ignore = [
    "D400",  # docstring: first line should end with a period
    "D403",  # docstring: first word of the docstring should be capitalized
    "D401",  # docstring: first line of docstring should be in imperative mood
    "D205",  # docstring: 1 blank line required between summary line and description
]

[lint.per-file-ignores]
"**/__init__.py" = ["D"]

[lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"

[lint.pydocstyle]
convention = "pep257"

[format]
quote-style = "single"
